CONFIG_GOLIOTH_OTA=n

CONFIG_ARDUINO_POUCH=y
# A gateway is loader-owned infrastructure, not something a sketch should have
# to start: waiting for Golioth.begin() also means waiting for main() to clear
# its USB DTR check, which strands the gateway if the CDC does not enumerate.
CONFIG_ARDUINO_POUCH_AUTOSTART=y
CONFIG_ARDUINO_POUCH_DEMO_UPLINK=n

# Sockets / DTLS
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=6000
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=4
CONFIG_NET_SOCKETS_TLS_MAX_CLIENT_SESSION_COUNT=2

# mbedTLS
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=70000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

# PSA crypto. Golioth server certificates use secp384r1, device
# certificates secp256r1, so both curves have to be present.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# RSA is not optional even though the device certificate is P-256: the DTLS
# trust root for coap.golioth.io is ISRG Root X1, which is RSA-4096 signed
# with sha256WithRSAEncryption. Without these, tls_credential parsing fails
# with MBEDTLS_ERR_X509_UNKNOWN_OID (-0x2100).
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# The loader migrates the shell - and with it the shell's log backend - from
# the console UART to USB CDC (loader/main.c, enable_shell_usb()). That leaves
# no log output on the UART, and on this board the CDC backend floods with
# "RX ring buffer full" under load. Keep an independent UART backend so the
# J-Link VCOM stays usable for bring-up.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

#
# Golioth Pouch gateway (BLE GATT broker -> CoAP cloud forwarder)
#
# The GATT broker is built under POUCH_GATEWAY, independent of the transport
# choice above, so the CoAP cloud path is unchanged. BT_MAX_CONN is 4 rather
# than the 16 pouch's own gateway example uses: this loader has far less RAM
# headroom than a dedicated gateway build.
CONFIG_POUCH_GATEWAY=y
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_MAX_CONN=4
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_SMP=y
CONFIG_BT_SECURITY_ERR_TO_STR=y

# Bluetooth pulls in the p256-m software driver, which pouch rejects outright:
# it removes secp384r1, and Golioth server certificates are signed with it.
# Pouch's CMake catches this with a FATAL_ERROR rather than letting it fail at
# handshake time.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

CONFIG_POUCH_BLOCK_SIZE=1024
CONFIG_POUCH_BLOCK_COUNT=12
CONFIG_POUCH_SERVER_CERT_MAX_LEN=2048
CONFIG_POUCH_GATEWAY_SERVER_CERT_MAX_LEN=2048

#
# Running the BLE broker alongside Wi-Fi and Pouch leaves this loader at ~92%
# RAM, and the NXP HCI driver faults handling an inbound ACL packet from the
# wireless core - the signature of memory corruption rather than a logic error.
#
# Bring the network buffers down to the profile Pouch's own frdm_rw612 gateway
# example uses. The stock Arduino tuning (60/80 x 1744 = 238 KB) is sized for
# Wi-Fi throughput benchmarking, which a gateway does not do.
#
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=36
CONFIG_NET_PKT_TX_COUNT=36
CONFIG_NET_ZPERF=n

# Catch a stack overflow at the point it happens instead of as a wild pointer
# somewhere else. This variant disables both by default.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y

#
# loader/prj.conf disables the MPU for all boards. On RW612 the shared memory
# used to talk to the wireless coprocessor lives at 0x443C0000, inside the
# ARMv7-M default map's peripheral region - which is Device memory, where any
# unaligned access faults unconditionally. NXP's HCI driver reads the ACL
# header with an unaligned 16-bit load, so every inbound BLE packet takes a
# K_ERR_ARM_USAGE_UNALIGNED_ACCESS. Turning the MPU on lets Zephyr map that
# region as Normal memory, where unaligned access is permitted.
#
CONFIG_ARM_MPU=y
