#
# Only read when the loader is built with 'west build --sysbuild', which
# extra/build.sh does exclusively for boards that set
# '<board>.build.zephyr_sysbuild=true' in boards.txt. Every other board still
# gets a plain single-image build and is unaffected by this file.
#
# MCUboot gives the loader a real slot0/slot1 pair, which is what makes a
# Golioth OTA of the whole OS possible. The sketch lives outside both slots -
# see the flash map comment in the board's variant overlay.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
